<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập hệ thống</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    display:flex;align-items:center;justify-content:center;
    padding:20px;color:#172033
}
.login-box{
    width:100%;max-width:460px;background:#fff;padding:38px;
    border-radius:22px;box-shadow:0 18px 50px rgba(30,60,100,.14)
}
.logo{
    width:58px;height:58px;border-radius:16px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:bold;margin-bottom:18px
}
h1{font-size:28px;margin-bottom:8px}
.subtitle{color:#6b7280;margin-bottom:28px}
label{display:block;font-weight:600;margin:16px 0 8px}
input{
    width:100%;padding:14px 15px;border:1px solid #d9deea;
    border-radius:11px;font-size:15px;outline:none;transition:.2s
}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.login-btn{
    width:100%;border:0;padding:14px;margin-top:22px;border-radius:11px;
    background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer
}
.login-btn:hover{background:#1d4ed8}
.divider{display:flex;align-items:center;gap:12px;margin:25px 0;color:#9ca3af;font-size:13px}
.divider:before,.divider:after{content:"";height:1px;background:#e5e7eb;flex:1}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.role-btn{
    padding:13px 10px;border:1px solid #dfe4ed;background:#f8fafc;
    border-radius:11px;cursor:pointer;font-weight:600;color:#273449
}
.role-btn:hover{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
.note{text-align:center;color:#8a93a3;font-size:12px;margin-top:20px}
#message{text-align:center;color:#dc2626;font-size:14px;margin-top:12px;min-height:18px}
</style>
</head>
<body>

<div class="login-box">
    <div class="logo">M</div>
    <h1>Đăng nhập</h1>
    <p class="subtitle">Hệ thống quản lý Mentor & New Hire</p>

    <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Nhập email của bạn" required>

        <label for="password">Mật khẩu</label>
        <input id="password" type="password" placeholder="Nhập mật khẩu" required>

        <button class="login-btn" type="submit">Đăng nhập</button>
    </form>

    <div id="message"></div>

    <div class="divider">Hoặc vào nhanh với vai trò</div>

    <div class="roles">
        <button class="role-btn" onclick="quickLogin('newhire')">👨‍💻 Vào vai New Hire</button>
        <button class="role-btn" onclick="quickLogin('mentor')">🧑‍🏫 Vào vai Mentor</button>
        <button class="role-btn" onclick="quickLogin('hr')">👥 Vào vai HR</button>
        <button class="role-btn" onclick="quickLogin('admin')">⚙️ Vào vai Admin</button>
    </div>

    <p class="note">Thông tin vai trò được lưu trong LocalStorage.</p>
</div>

<script>
const dashboards = {
    newhire: "newhire-dashboard.html",
    mentor: "mentor-dashboard.html",
    hr: "hr-dashboard.html",
    admin: "admin-dashboard.html"
};

function saveAndRedirect(role, email) {
    localStorage.setItem("userRole", role);
    localStorage.setItem("userEmail", email || "demo@example.com");
    localStorage.setItem("isLoggedIn", "true");

    window.location.href = dashboards[role];
}

function quickLogin(role) {
    saveAndRedirect(role, "demo@example.com");
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        document.getElementById("message").textContent =
            "Vui lòng nhập đầy đủ Email và Mật khẩu.";
        return;
    }

    // Demo: mặc định đăng nhập với vai trò Mentor
    saveAndRedirect("mentor", email);
});
</script>

</body>
</html>
